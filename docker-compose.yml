version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: remotebot_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./remotebot.db
      - SECRET_KEY=remotebot-super-secret-key-production-change-me
      - SIMULATION_HZ=50
      - TELEMETRY_HZ=20
    volumes:
      - backend_data:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: remotebot_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
